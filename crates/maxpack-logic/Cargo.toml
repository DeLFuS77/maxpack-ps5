[package]
name = "maxpack-logic"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Logic of the MaxPack payload that needs no PS5, tested on the host: imported scan roots and the paths never scanned, other-mounter state, ShadowMountPlus image kinds, installed games, the request checks of port 8095, installer route forwarding, the per-game report, crash records, the Play gate, the per-title lists the self-update (release offered, SHA256SUMS check, one update at a time), the same checks for the ampr-emu-ng update, and the secure-connection self-test both need, the console's verify of a .p5z and the receive from the PC (pairing code and lockout, names, drives, resume, refusals)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
