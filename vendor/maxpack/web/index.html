<!doctype html>

<!-- Página del instalador de MaxPack. JS en ES5 y XMLHttpRequest, para el navegador de la PS5. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxPack</title>
<style>
:root {
  --ink: #151a2e;
  --panel: #1e2442;
  --line: #313a66;
  --text: #e9ecf8;
  --muted: #9ba4c9;
  --amber: #f2b544;
  --amber-ink: #241a03;
  --ok: #5fd3a5;
  --bad: #ff7070;
  --r: 10px;
}
* { box-sizing: border-box; }
html { background: var(--ink); }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 48px; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  padding: 20px 0 16px; border-bottom: 1px solid var(--line);
}
.mark { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.sub { display: block; color: var(--muted); font-size: 15px; }
.tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.smp { font-size: 14px; color: var(--muted); max-width: 420px; }
.smp.on { color: var(--ok); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.lang button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 8px 14px; min-height: 40px; }
.lang button[aria-pressed="true"] { background: var(--line); color: var(--text); }
h2 { font-size: 20px; font-weight: 700; margin: 32px 0 12px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head h2 { margin-bottom: 12px; }
button {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px 18px; min-height: 48px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible, input:focus-visible, .game:focus-visible, .drive:focus-visible {
  outline: 3px solid var(--amber); outline-offset: 2px;
}
button.primary {
  background: var(--amber); color: var(--amber-ink); border-color: var(--amber);
  font-weight: 700; font-size: 18px; padding: 12px 32px; min-height: 56px;
}
button.primary:disabled { opacity: 0.5; cursor: default; }
button.danger { color: var(--bad); }
.games { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.game {
  display: flex; align-items: center; gap: 16px; padding: 14px 12px; border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.game.static { cursor: default; }
.game[aria-checked="true"] { background: var(--panel); box-shadow: inset 4px 0 0 var(--amber); }
.icon { width: 64px; height: 64px; border-radius: 8px; flex: none; background: var(--panel); object-fit: cover; }
.ph {
  width: 64px; height: 64px; border-radius: 8px; flex: none; background: var(--line); color: var(--muted);
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px;
}
.info { flex: 1; min-width: 0; }
.name { font-size: 18px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 14px; margin: 2px 0 0; overflow-wrap: anywhere; }
.pending { color: var(--amber); font-size: 14px; margin: 4px 0 0; }
.size { width: 240px; flex: none; }
.pct { font-size: 30px; font-weight: 800; color: var(--amber); line-height: 1; font-variant-numeric: tabular-nums; }
.pct small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.cmp { height: 10px; background: var(--line); border-radius: 5px; margin: 10px 0 6px; overflow: hidden; }
.cmp i { display: block; height: 100%; background: var(--amber); border-radius: 5px; }
.nums { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nums b { color: var(--text); font-weight: 600; }
.actions { display: flex; gap: 8px; flex: none; }
.empty { color: var(--muted); margin: 12px 0; max-width: 60ch; }
.manual { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.manual input {
  flex: 1; min-width: 220px; font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; min-height: 48px;
}
.drives { display: flex; flex-wrap: wrap; gap: 8px; }
.drive { text-align: left; min-width: 200px; }
.drive[aria-checked="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.drive span { display: block; color: var(--muted); font-size: 14px; }
.check { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--muted); }
.check input { width: 22px; height: 22px; accent-color: var(--amber); }
.job { margin-top: 24px; padding: 18px 20px; background: var(--panel); border-radius: var(--r); }
.job .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.job .what { font-size: 18px; font-weight: 700; }
.job .pct { font-size: 40px; }
.bar { height: 14px; background: var(--ink); border-radius: 7px; margin: 14px 0 10px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); transition: width 0.8s linear; }
.job .nums { font-size: 15px; }
.msg { margin-top: 16px; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line); }
.msg.ok { border-color: var(--ok); }
.msg.err { border-color: var(--bad); }
.msg p { margin: 0; }
.msg .detail { color: var(--muted); font-size: 14px; margin-top: 4px; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
  .game { flex-wrap: wrap; }
  .size { width: 100%; }
  .actions { width: 100%; }
  .actions button { flex: 1; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <span class="mark">MaxPack</span>
      <span class="sub" data-t="subtitle"></span>
    </div>
    <div class="tools">
      <span id="smp" class="smp"></span>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <section id="job" class="job" hidden aria-live="polite">
    <div class="line">
      <span class="what" id="job-what"></span>
      <span class="pct" id="job-pct"></span>
    </div>
    <div class="bar"><i id="job-bar"></i></div>
    <div class="line">
      <span class="nums" id="job-nums"></span>
      <button type="button" id="pause" data-t="pause"></button>
    </div>
  </section>

  <div id="msg" class="msg" role="status" hidden><p id="msg-text"></p><p class="detail" id="msg-detail"></p></div>

  <section id="pending-box" hidden>
    <h2 data-t="pendingTitle"></h2>
    <ul id="pending" class="games"></ul>
  </section>

  <section>
    <div class="head">
      <h2 data-t="found"></h2>
      <button type="button" id="rescan" data-t="rescan"></button>
    </div>
    <ul id="found" class="games" role="radiogroup"></ul>
    <p id="found-empty" class="empty" data-t="foundEmpty" hidden></p>
    <form id="manual" class="manual">
      <input id="manual-path" type="text" autocomplete="off" spellcheck="false">
      <button type="submit" data-t="add"></button>
    </form>
  </section>

  <section>
    <h2 data-t="dest"></h2>
    <div id="drives" class="drives" role="radiogroup"></div>
    <label class="check" id="del-row"><input type="checkbox" id="del"> <span data-t="deleteP5z"></span></label>
    <button type="button" id="install" class="primary" data-t="install"></button>
  </section>

  <section>
    <h2 data-t="installed"></h2>
    <ul id="installed" class="games"></ul>
    <p id="installed-empty" class="empty" data-t="installedEmpty" hidden></p>
  </section>
</div>

<script>
(function () {
  "use strict";
  var T = {
    es: {
      subtitle: "Instala tus juegos comprimidos",
      found: "Juegos para instalar",
      rescan: "Buscar otra vez",
      foundEmpty: "No hay ningún .p5z en los USB ni en /data/maxpack. Conecta un USB con tus .p5z y pulsa Buscar otra vez.",
      manualPh: "Ruta de un .p5z, por ejemplo /mnt/usb0/juego.p5z",
      add: "Añadir",
      dest: "Dónde instalar",
      internal: "Almacenamiento interno",
      free: "%s libres",
      deleteP5z: "Borrar el .p5z cuando esté instalado y verificado",
      install: "Instalar",
      pickFirst: "Elige primero un juego de la lista.",
      installed: "Instalados con MaxPack",
      installedEmpty: "Todavía no has instalado ningún juego con MaxPack.",
      verify: "Verificar",
      uninstall: "Desinstalar",
      pause: "Pausar",
      paused: "Pausando…",
      copiando: "Copiando %n",
      comprobando: "Comprobando %n",
      terminando: "Terminando %n",
      registrando: "Registrando %n en ShadowMountPlus",
      verifying: "Verificando %n",
      counts: "%o correctos, %b con fallos",
      uninstalling: "Desinstalando %n",
      queue: "%q más en cola",
      left: "quedan %s",
      smpOn: "ShadowMountPlus %s conectado",
      smpOff: "ShadowMountPlus no está en marcha: los juegos se registrarán cuando arranque",
      pending: "Pendiente en ShadowMountPlus: %s",
      smaller: "menos",
      installedAs: "%s instalado",
      ofOriginal: "de %s",
      version: "versión %s",
      pendingTitle: "Instalaciones a medias",
      pendingMeta: "%s copiados. Origen: %o",
      resume: "Seguir",
      discard: "Descartar",
      confirmDiscard: "Se borrará lo ya copiado de %n (%s).\n\n¿Descartar?",
      discarded: "Descartado.",
      kind_p5z: ".p5z de MaxPack",
      kind_folder: "Carpeta",
      kind_image: "Imagen",
      asIs: "se copia tal cual",
      bad_source: "Esa carpeta o imagen no se puede instalar.",
      queued: "En cola. Puedes seguir usando la página.",
      confirmReplace: "Para que quede una sola copia, después de instalar y verificar la nueva se borrará:",
      confirmReplaceQ: "¿Instalar y reemplazar?",
      confirmUninstall: "Se borrará %d\n\n¿Desinstalar %n?",
      net: "No hay conexión con la consola. Comprueba que MaxPack sigue cargado.",
      done_install: "%n instalado.",
      done_verify: "%n verificado.",
      done_uninstall: "%n desinstalado.",
      stopped: "En pausa. Pulsa Instalar para seguir donde se quedó.",
      no_space: "No cabe: faltan %s.",
      bad_p5z: "El .p5z está dañado o no es válido.",
      bad_dest: "Esa unidad ya no está conectada.",
      no_runtime: "Este .p5z no trae ampr-emu-ng y el instalador no lleva ninguno. Vuelve a empaquetarlo con --runtime.",
      io_error: "No se pudo escribir en la unidad.",
      bad_path: "Esa ruta no es un .p5z de un USB o de /data.",
      busy: "Ese juego ya se está instalando o está en cola.",
      not_found: "Ese juego no está instalado con MaxPack.",
      verify_bad: "La verificación encontró archivos dañados.",
      game_running: "Cierra el juego antes.",
      needs_confirm: "Hace falta tu confirmación.",
      bad_json: "Petición no válida."
    },
    en: {
      subtitle: "Install your compressed games",
      found: "Games to install",
      rescan: "Search again",
      foundEmpty: "No .p5z found on USB drives or in /data/maxpack. Plug in a USB drive with your .p5z files and press Search again.",
      manualPh: "Path to a .p5z, for example /mnt/usb0/game.p5z",
      add: "Add",
      dest: "Where to install",
      internal: "Internal storage",
      free: "%s free",
      deleteP5z: "Delete the .p5z once it is installed and verified",
      install: "Install",
      pickFirst: "Pick a game from the list first.",
      installed: "Installed with MaxPack",
      installedEmpty: "You haven't installed any game with MaxPack yet.",
      verify: "Verify",
      uninstall: "Uninstall",
      pause: "Pause",
      paused: "Pausing…",
      copiando: "Copying %n",
      comprobando: "Checking %n",
      terminando: "Finishing %n",
      registrando: "Registering %n in ShadowMountPlus",
      verifying: "Verifying %n",
      counts: "%o OK, %b damaged",
      uninstalling: "Uninstalling %n",
      queue: "%q more queued",
      left: "%s left",
      smpOn: "ShadowMountPlus %s connected",
      smpOff: "ShadowMountPlus is not running: games will be registered when it starts",
      pending: "Pending in ShadowMountPlus: %s",
      smaller: "smaller",
      installedAs: "%s installed",
      ofOriginal: "of %s",
      version: "version %s",
      pendingTitle: "Unfinished installs",
      pendingMeta: "%s copied. Source: %o",
      resume: "Resume",
      discard: "Discard",
      confirmDiscard: "What was copied of %n (%s) will be deleted.\n\nDiscard?",
      discarded: "Discarded.",
      kind_p5z: "MaxPack .p5z",
      kind_folder: "Folder",
      kind_image: "Image",
      asIs: "copied as is",
      bad_source: "That folder or image can't be installed.",
      queued: "Queued. You can keep using the page.",
      confirmReplace: "So that only one copy is left, once the new one is installed and verified this will be deleted:",
      confirmReplaceQ: "Install and replace?",
      confirmUninstall: "%d will be deleted\n\nUninstall %n?",
      net: "Can't reach the console. Check that MaxPack is still loaded.",
      done_install: "%n installed.",
      done_verify: "%n verified.",
      done_uninstall: "%n uninstalled.",
      stopped: "Paused. Press Install to continue where it stopped.",
      no_space: "Not enough space: %s more needed.",
      bad_p5z: "The .p5z is damaged or not valid.",
      bad_dest: "That drive is no longer connected.",
      no_runtime: "This .p5z has no ampr-emu-ng and the installer doesn't carry one. Pack it again with --runtime.",
      io_error: "Couldn't write to the drive.",
      bad_path: "That path isn't a .p5z on a USB drive or in /data.",
      busy: "That game is already installing or queued.",
      not_found: "That game isn't installed with MaxPack.",
      verify_bad: "Verification found damaged files.",
      game_running: "Close the game first.",
      needs_confirm: "Your confirmation is needed.",
      bad_json: "Invalid request."
    }
  };

  var lang = pickLang();
  var state = null;
  var selected = null;
  var dest = null;
  var extra = [];
  var keys = { found: "", installed: "", drives: "", last: "", pending: "" };
  var speed = { title: "", t: 0, done: 0, v: 0 };

  function $(id) { return document.getElementById(id); }
  function t(k) { return (T[lang] && T[lang][k]) || T.es[k] || k; }

  function pickLang() {
    try {
      var s = window.localStorage.getItem("mp-lang");
      if (s === "es" || s === "en") return s;
    } catch (e) {}
    var n = (navigator.language || "es").toLowerCase();
    return n.indexOf("es") === 0 ? "es" : "en";
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function num(s) { return lang === "es" ? s.replace(".", ",") : s; }

  function size(n) {
    if (!n || n < 0) n = 0;
    if (n >= 1e9) {
      var g = n / 1e9;
      return num(g.toFixed(g >= 100 ? 0 : g >= 10 ? 1 : 2)) + " GB";
    }
    if (n >= 1e6) {
      var m = n / 1e6;
      return num(m.toFixed(m >= 100 ? 0 : 1)) + " MB";
    }
    if (n >= 1e3) return num((n / 1e3).toFixed(n >= 1e5 ? 0 : 1)) + " KB";
    return Math.round(n) + " B";
  }

  function duration(s) {
    if (!isFinite(s) || s <= 0) return "";
    if (s < 60) return Math.round(s) + " s";
    if (s < 3600) return Math.round(s / 60) + " min";
    var h = Math.floor(s / 3600);
    return h + " h " + Math.round((s - h * 3600) / 60) + " min";
  }

  function request(method, path, body, cb) {
    var x = new XMLHttpRequest();
    x.open(method, path, true);
    x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var j = null;
      try { j = JSON.parse(x.responseText); } catch (e) {}
      cb(x.status, j);
    };
    x.send(body ? JSON.stringify(body) : null);
  }

  function show(kind, text, detail) {
    var m = $("msg");
    m.className = "msg " + (kind || "");
    $("msg-text").textContent = text;
    $("msg-detail").textContent = detail || "";
    $("msg-detail").hidden = !detail;
    m.hidden = false;
  }

  function nameFor(title) {
    var lists = [state ? state.found : [], extra, state ? state.installed : []];
    for (var l = 0; l < lists.length; l++)
      for (var i = 0; i < lists[l].length; i++)
        if (lists[l][i].title_id === title && lists[l][i].name) return lists[l][i].name;
    return title;
  }

  function applyTexts() {
    document.documentElement.lang = lang;
    var nodes = document.querySelectorAll("[data-t]");
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute("data-t"));
    $("manual-path").placeholder = t("manualPh");
    var b = document.querySelectorAll(".lang button");
    for (var k = 0; k < b.length; k++) b[k].setAttribute("aria-pressed", b[k].getAttribute("data-lang") === lang ? "true" : "false");
    keys.found = keys.installed = keys.drives = keys.last = keys.pending = "";
    if (state) render();
  }

  function iconFor(item) {
    var img = el("img", "icon");
    img.alt = "";
    img.src = "/api/icon?p5z=" + encodeURIComponent(item.path);
    img.onerror = function () {
      var ph = el("div", "ph", (item.name || item.title_id || "?").charAt(0).toUpperCase());
      if (img.parentNode) img.parentNode.replaceChild(ph, img);
    };
    return img;
  }

  function sizeBlock(item) {
    var box = el("div", "size");
    if (item.kind && item.kind !== "p5z") {   // tal cual: sin barra de ahorro
      var plain = el("div", "pct", size(item.install_size));
      plain.appendChild(el("small", null, t("asIs")));
      box.appendChild(plain);
      return box;
    }
    var orig = item.original_size || item.install_size;
    var ratio = orig ? item.install_size / orig : 1;
    var saved = Math.floor((1 - ratio) * 100);
    var pct = el("div", "pct", saved > 0 ? "−" + saved + " %" : "0 %");
    pct.appendChild(el("small", null, t("smaller")));
    box.appendChild(pct);
    var bar = el("div", "cmp");
    var fill = el("i");
    fill.style.width = Math.max(2, Math.min(100, ratio * 100)).toFixed(1) + "%";
    bar.appendChild(fill);
    box.appendChild(bar);
    var nums = el("div", "nums");
    nums.appendChild(el("b", null, t("installedAs").replace("%s", size(item.install_size))));
    nums.appendChild(el("span", null, t("ofOriginal").replace("%s", size(orig))));
    box.appendChild(nums);
    return box;
  }

  function kindOf(path) {
    var list = allFound();
    for (var i = 0; i < list.length; i++) if (list[i].path === path) return list[i].kind || "p5z";
    return "p5z";
  }

  function select(path) {
    selected = path;
    var isP5z = kindOf(path) === "p5z";
    $("del-row").hidden = !isP5z;
    if (!isP5z) $("del").checked = false;
    var rows = $("found").children;
    for (var i = 0; i < rows.length; i++)
      rows[i].setAttribute("aria-checked", rows[i].getAttribute("data-path") === path ? "true" : "false");
  }

  function foundRow(item) {
    var li = el("li", "game");
    li.setAttribute("role", "radio");
    li.setAttribute("tabindex", "0");
    li.setAttribute("data-path", item.path);
    li.setAttribute("aria-checked", item.path === selected ? "true" : "false");
    li.appendChild(iconFor(item));
    var info = el("div", "info");
    info.appendChild(el("p", "name", item.name || item.title_id));
    var meta = t("kind_" + (item.kind || "p5z")) + ". " + item.title_id +
      (item.version ? ", " + t("version").replace("%s", item.version) : "") + ". " + item.path;
    info.appendChild(el("p", "meta", meta));
    li.appendChild(info);
    li.appendChild(sizeBlock(item));
    li.onclick = function () { select(item.path); };
    li.onkeydown = function (ev) {
      if (ev.keyCode === 13 || ev.keyCode === 32) { ev.preventDefault(); select(item.path); }
    };
    return li;
  }

  function allFound() {
    var list = state ? state.found.slice(0) : [];
    for (var i = 0; i < extra.length; i++) {
      var dup = false;
      for (var k = 0; k < list.length; k++) if (list[k].path === extra[i].path) dup = true;
      if (!dup) list.push(extra[i]);
    }
    return list;
  }

  function renderFound() {
    var list = allFound();
    var key = lang + JSON.stringify(list) + selected;
    if (key === keys.found) return;
    keys.found = key;
    var ul = $("found");
    clear(ul);
    for (var i = 0; i < list.length; i++) ul.appendChild(foundRow(list[i]));
    if (!selected && list.length === 1) select(list[0].path);
    $("found-empty").hidden = list.length > 0;
  }

  function renderDrives() {
    var key = lang + JSON.stringify(state.drives) + dest;
    if (key === keys.drives) return;
    keys.drives = key;
    var box = $("drives");
    clear(box);
    var still = false;
    for (var i = 0; i < state.drives.length; i++) if (state.drives[i].root === dest) still = true;
    if (!still && state.drives.length) dest = state.drives[0].root;
    for (var d = 0; d < state.drives.length; d++) {
      (function (dr) {
        var b = el("button", "drive", dr.internal ? t("internal") : dr.root);
        b.type = "button";
        b.setAttribute("role", "radio");
        b.setAttribute("aria-checked", dr.root === dest ? "true" : "false");
        b.appendChild(el("span", null, t("free").replace("%s", size(dr.free))));
        b.onclick = function () { dest = dr.root; keys.drives = ""; renderDrives(); };
        box.appendChild(b);
      })(state.drives[d]);
    }
  }

  function installedRow(g) {
    var li = el("li", "game static");
    li.appendChild(el("div", "ph", (g.name || g.title_id).charAt(0).toUpperCase()));
    var info = el("div", "info");
    info.appendChild(el("p", "name", g.name || g.title_id));
    info.appendChild(el("p", "meta", g.title_id + (g.version ? ", " + t("version").replace("%s", g.version) : "") + ". " + g.dir));
    if (g.smp_pending) info.appendChild(el("p", "pending", t("pending").replace("%s", g.smp_why || "")));
    li.appendChild(info);
    var act = el("div", "actions");
    var v = el("button", null, t("verify"));
    v.type = "button";
    v.onclick = function () { post("/api/verify", { title_id: g.title_id }); };
    var u = el("button", "danger", t("uninstall"));
    u.type = "button";
    u.onclick = function () {
      var q = t("confirmUninstall").replace("%d", g.dir).replace("%n", g.name || g.title_id);
      if (window.confirm(q)) post("/api/uninstall", { title_id: g.title_id, confirm: true });
    };
    act.appendChild(v);
    act.appendChild(u);
    li.appendChild(act);
    return li;
  }

  function renderInstalled() {
    var key = lang + JSON.stringify(state.installed);
    if (key === keys.installed) return;
    keys.installed = key;
    var ul = $("installed");
    clear(ul);
    for (var i = 0; i < state.installed.length; i++) ul.appendChild(installedRow(state.installed[i]));
    $("installed-empty").hidden = state.installed.length > 0;
  }

  function pendingRow(p) {
    var name = nameFor(p.title_id);
    var li = el("li", "game static");
    li.appendChild(el("div", "ph", name.charAt(0).toUpperCase()));
    var info = el("div", "info");
    info.appendChild(el("p", "name", name));
    info.appendChild(el("p", "meta", t("pendingMeta").replace("%s", size(p.bytes)).replace("%o", p.source)));
    li.appendChild(info);
    var act = el("div", "actions");
    var go = el("button", null, t("resume"));
    go.type = "button";
    go.onclick = function () { installFrom(p.source, p.dest, [], false); };
    var drop = el("button", "danger", t("discard"));
    drop.type = "button";
    drop.onclick = function () {
      var q = t("confirmDiscard").replace("%n", name).replace("%s", size(p.bytes));
      if (!window.confirm(q)) return;
      post("/api/discard", { title_id: p.title_id }, function (j) {
        if (j.ok) show("ok", t("discarded"));
        else show("err", t(j.code), j.detail);
      });
    };
    act.appendChild(go);
    act.appendChild(drop);
    li.appendChild(act);
    return li;
  }

  function renderPending() {
    var list = state.pending || [];
    var key = lang + JSON.stringify(list);
    if (key === keys.pending) return;
    keys.pending = key;
    var ul = $("pending");
    clear(ul);
    for (var i = 0; i < list.length; i++) ul.appendChild(pendingRow(list[i]));
    $("pending-box").hidden = list.length === 0;
  }

  function renderJob() {
    var j = state.job;
    $("job").hidden = !j;
    if (!j) { speed.title = ""; return; }
    var name = j.name || nameFor(j.title_id);
    var label = j.kind === "verify" ? "verifying" : j.kind === "uninstall" ? "uninstalling" : (j.stage || "copiando");
    $("job-what").textContent = t(label).replace("%n", name);
    var frac = j.total ? Math.min(1, j.done / j.total) : 0;
    $("job-pct").textContent = Math.floor(frac * 100) + " %";
    $("job-bar").style.width = (frac * 100).toFixed(1) + "%";
    var now = new Date().getTime();
    if (speed.title !== j.title_id + j.stage) {
      speed.title = j.title_id + j.stage;
      speed.t = now;
      speed.done = j.done;
      speed.v = 0;
    } else if (now > speed.t && j.done >= speed.done) {
      var v = (j.done - speed.done) / ((now - speed.t) / 1000);
      speed.v = speed.v ? speed.v * 0.7 + v * 0.3 : v;
      speed.t = now;
      speed.done = j.done;
    }
    var parts = [size(j.done) + " / " + size(j.total)];
    if (speed.v > 0) {
      parts.push(size(speed.v) + "/s");
      var eta = duration((j.total - j.done) / speed.v);
      if (eta) parts.push(t("left").replace("%s", eta));
    }
    if (state.queue) parts.push(t("queue").replace("%q", state.queue));
    $("job-nums").textContent = parts.join("   ");
    $("pause").hidden = j.kind !== "install";
    $("pause").textContent = j.paused ? t("paused") : t("pause");
    $("pause").disabled = !!j.paused;
  }

  function renderLast() {
    var l = state.last;
    if (!l) return;
    var key = lang + JSON.stringify(l);
    if (key === keys.last) return;
    var first = keys.last === "";
    keys.last = key;
    if (first && !l.code) return;
    var name = nameFor(l.title_id);
    if (l.code === "needs_confirm" && l.existing && l.source) {
      askReplace(l.source, l.dest, l.existing, false);
      return;
    }
    var counts = l.files_ok !== undefined ? t("counts").replace("%o", l.files_ok).replace("%b", l.files_bad) : "";
    if (l.code === "done") show("ok", t("done_" + l.kind).replace("%n", name), counts);
    else show("err", t(l.code), counts || l.detail);
  }

  function renderSmp() {
    var s = $("smp");
    s.className = "smp" + (state.smp.alive ? " on" : "");
    s.textContent = state.smp.alive ? t("smpOn").replace("%s", state.smp.version) : t("smpOff");
  }

  function render() {
    renderSmp();
    renderJob();
    renderPending();
    renderFound();
    renderDrives();
    renderInstalled();
    renderLast();
  }

  function poll() {
    request("GET", "/api/state", null, function (st, j) {
      if (st === 200 && j) {
        state = j;
        render();
      } else if (!state) {
        show("err", t("net"));
      }
      window.setTimeout(poll, 1000);
    });
  }

  function post(path, body, done) {
    request("POST", path, body, function (st, j) {
      if (!j) { show("err", t("net")); return; }
      if (done) { done(j); return; }
      if (!j.ok) show("err", t(j.code), j.detail);
    });
  }

  function askReplace(src, dst, existing, del) {
    var lines = [t("confirmReplace"), ""], paths = [];
    for (var i = 0; i < existing.length; i++) {
      lines.push(existing[i].path + " (" + size(existing[i].size) + ")");
      paths.push(existing[i].path);
    }
    lines.push("", t("confirmReplaceQ"));
    if (window.confirm(lines.join("\n"))) installFrom(src, dst, paths, del);
  }

  function installFrom(src, dst, replace, del) {
    var body = { p5z: src, dest: dst, replace: replace || [], delete_p5z: !!del };
    post("/api/install", body, function (j) {
      if (j.ok) { show("ok", t("queued")); return; }
      if (j.code === "needs_confirm" && j.existing) { askReplace(src, dst, j.existing, del); return; }
      if (j.code === "no_space") { show("err", t("no_space").replace("%s", size(j.need - j.avail))); return; }
      show("err", t(j.code), j.detail);
    });
  }

  function install() {
    if (!selected) { show("err", t("pickFirst")); return; }
    installFrom(selected, dest, [], $("del").checked);
  }

  $("install").onclick = function () { install(); };
  $("pause").onclick = function () { post("/api/pause", {}); };
  $("rescan").onclick = function () { post("/api/scan", {}, function () { keys.found = ""; }); };
  $("manual").onsubmit = function (ev) {
    ev.preventDefault();
    var p = $("manual-path").value.replace(/^\s+|\s+$/g, "");
    if (!p) return;
    post("/api/probe", { path: p }, function (j) {
      if (!j.ok) { show("err", t(j.code), j.detail); return; }
      extra.push(j.found);
      selected = j.found.path;
      $("manual-path").value = "";
      keys.found = "";
      if (state) render();
    });
  };
  var langs = document.querySelectorAll(".lang button");
  for (var i = 0; i < langs.length; i++) {
    langs[i].onclick = function () {
      lang = this.getAttribute("data-lang");
      try { window.localStorage.setItem("mp-lang", lang); } catch (e) {}
      applyTexts();
    };
  }
  applyTexts();
  poll();
})();
</script>
</body>
</html>
