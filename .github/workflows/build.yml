# Host check (cargo check + UI script syntax), the payload build, and draft releases on v* tags.
name: build

on:
  # Every push (any branch or tag) runs the check and the build; only v* tags release.
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      # Same toolchain as ps5/Dockerfile. The crate builds only for FreeBSD/PS5: no cargo test.
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-unknown-freebsd
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Identity (tools/check_identity.sh)
        run: bash tools/check_identity.sh
      # Every self-test runs on a full copy of the scanned paths (the positive control proves the
      # copy is complete), so the only reason a planted copy fails is the planted defect.
      - name: Identity self-tests (a clean copy passes; each planted defect fails)
        run: |
          mk() { t=$(mktemp -d); cp -r tools src ps5 .github docs vendor crates Cargo.toml "$t"/; }
          expect_fail() { # $1 = what was planted
            if bash "$t/tools/check_identity.sh"; then echo "self-test: $1 not detected"; exit 1; fi
            echo "self-test: $1 detected"
          }
          # The URL is built in pieces so this file does not contain it.
          url="quer3q/ampr-emu-ng/rel""eases/latest"
          mk
          bash "$t/tools/check_identity.sh"
          echo "self-test: clean copy passes"
          mk
          echo Kraken-Mount | tr - ' ' >> "$t/docs/planted.md"
          expect_fail "planted old name"
          mk
          # The old port, written without the literal so this file stays clean.
          echo "puerto $((8000 + 97))" >> "$t/docs/pruebas-consola.md"
          expect_fail "old port in the checklist"
          mk
          printf 'v0.5.0' > "$t/vendor/ampr-emu-ng/VERSION"
          expect_fail "VERSION without -maxpack.N"
          mk
          echo "// https://github.com/$url" >> "$t/crates/maxpack-logic/src/lib.rs"
          expect_fail "quer3q releases URL in crates/"
          mk
          echo "# https://github.com/$url" > "$t/tools/planted.sh"
          expect_fail "quer3q releases URL in tools/"
          mk
          # An About credit line with more on it than the allowed text (the name in pieces, as above).
          printf "    aboutBased: 'Based on Kraken%sMount by quer3q.', aboutMore: 'x',\n" ' ' >> "$t/src/ui.html"
          expect_fail "old name in ui.html beyond the credit lines"
      - name: cargo check --workspace
        run: cargo check --workspace --locked --target x86_64-unknown-freebsd
      - name: node --check (src/ui.html script)
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' src/ui.html | sed '1d;$d' > "$RUNNER_TEMP/ui.js"
          test -s "$RUNNER_TEMP/ui.js"
          node --check "$RUNNER_TEMP/ui.js"

  logic:
    name: logic
    runs-on: ubuntu-latest
    env:
      # Same toolchain as the check job. Pure std: the tests run on the host.
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: logic-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: logic-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: cargo test -p maxpack-logic
        run: cargo test -p maxpack-logic --locked

  payload:
    name: build payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            target/ps5/cargo/registry
            target/ps5/cargo/git
          key: payload-cargo-${{ hashFiles('Cargo.lock', 'ps5/Dockerfile') }}
          restore-keys: payload-cargo-
      - name: ps5/build.sh (Docker)
        run: ./ps5/build.sh
      # build.sh already fails without them; this shows them in the log (the ELF is stripped:
      # the names come from lld's map of the link).
      - name: MaxPack engine in maxpack.elf (mp_api_call, mp_inst_install)
        run: |
          cat target/ps5/maxpack.elf.txt
          grep -E '(^| )mp_api_call$' target/ps5/maxpack.elf.txt
          grep -E '(^| )mp_inst_install$' target/ps5/maxpack.elf.txt
      - name: sha256
        run: |
          cp target/ps5/maxpack.elf .
          sha256sum maxpack.elf | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: |
            maxpack.elf
            SHA256SUMS
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, payload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: payload
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            maxpack.elf SHA256SUMS
