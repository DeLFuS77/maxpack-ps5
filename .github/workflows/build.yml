# Host check (cargo check + UI script syntax), the payload build, and draft releases on v* tags.
name: build

on:
  # Every push (any branch or tag) runs the check and the build; only v* tags release.
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      # Same toolchain as ps5/Dockerfile. The crate builds only for FreeBSD/PS5: no cargo test.
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-unknown-freebsd
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: host-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: Identity (tools/check_identity.sh)
        run: bash tools/check_identity.sh
      - name: Identity self-test (a planted old name must fail)
        run: |
          t=$(mktemp -d)
          cp -r tools src ps5 .github docs "$t"/
          echo Kraken-Mount | tr - ' ' >> "$t/docs/planted.md"
          if bash "$t/tools/check_identity.sh"; then echo "self-test: planted name not detected"; exit 1; fi
          echo "self-test: planted name detected"
      - name: Identity self-test (the console checklist allows only its three tokens)
        run: |
          t=$(mktemp -d)
          cp -r tools src ps5 .github docs "$t"/
          # The old port, written without the literal so this file stays clean.
          echo "puerto $((8000 + 97))" >> "$t/docs/pruebas-consola.md"
          if bash "$t/tools/check_identity.sh"; then echo "self-test: old port in the checklist not detected"; exit 1; fi
          echo "self-test: old port in the checklist detected"
      - name: cargo check --workspace
        run: cargo check --workspace --locked --target x86_64-unknown-freebsd
      - name: node --check (src/ui.html script)
        run: |
          sed -n '/^<script>$/,/^<\/script>$/p' src/ui.html | sed '1d;$d' > "$RUNNER_TEMP/ui.js"
          test -s "$RUNNER_TEMP/ui.js"
          node --check "$RUNNER_TEMP/ui.js"

  logic:
    name: logic
    runs-on: ubuntu-latest
    env:
      # Same toolchain as the check job. Pure std: the tests run on the host.
      RUSTUP_TOOLCHAIN: 1.99.0
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: logic-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: logic-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-
      - name: cargo test -p maxpack-logic
        run: cargo test -p maxpack-logic --locked

  payload:
    name: build payload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            target/ps5/cargo/registry
            target/ps5/cargo/git
          key: payload-cargo-${{ hashFiles('Cargo.lock', 'ps5/Dockerfile') }}
          restore-keys: payload-cargo-
      - name: ps5/build.sh (Docker)
        run: ./ps5/build.sh
      - name: sha256
        run: |
          cp target/ps5/maxpack.elf .
          sha256sum maxpack.elf | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: |
            maxpack.elf
            SHA256SUMS
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, payload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: payload
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --draft \
            --generate-notes \
            maxpack.elf SHA256SUMS
